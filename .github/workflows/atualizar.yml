name: Radar de Editais - Pipeline Completo

on:
  schedule:
    - cron: "0 6,12,18,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-pipeline
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Buscar e extrair novos editais (IA)
        run: python -u radar.py run

      - name: 2. Resgatar prazos que a IA falhou (Regex)
        run: python resgatar_pendencias.py

      - name: 3. Exportar JSON formatado para o site
        run: python exportar_manual.py

      - name: 4. Salvar tudo de volta no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.db docs/editais.json data/
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Robô: Atualização automática de editais"
            git pull --rebase origin main || git rebase --abort
            git push origin main || git push -f origin main
          fi
