name: Atualizar editais

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 06:00 em Brasília
  workflow_dispatch:       # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  atualizar:
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      RADAR_EMAIL: ${{ secrets.RADAR_EMAIL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RADAR_DB: data/radar.db
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python radar.py run
      - run: python radar.py export --saida docs/editais.json
      - name: Salvar alterações
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data docs/editais.json
          git diff --cached --quiet || git commit -m "Atualiza editais $(date -u +%F)"
          git push
