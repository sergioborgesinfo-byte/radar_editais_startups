name: Descobrir oportunidades

on:
  schedule:
    - cron: "0 6,12,18,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [descobrir_oportunidades.py, sources.json, '.github/workflows/atualizar.yml']

permissions:
  contents: write

concurrency:
  group: radar-pipeline
  cancel-in-progress: false

jobs:
  descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || secrets.TAVILY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependência de busca
        run: python -m pip install --index-url https://pypi.org/simple requests
      - name: Descobrir sem verificar prazos
        run: python -u descobrir_oportunidades.py
      - name: Guardar relatório de descoberta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oportunidades-descobertas
          path: |
            data/oportunidades-descobertas.json
            data/descobertas.md
          if-no-files-found: ignore
      - name: Salvar somente descobertas
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${{ github.actor_id }}+$GITHUB_ACTOR@users.noreply.github.com"
          git add data/oportunidades-descobertas.json data/descobertas.md
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza candidatos descobertos; vigência não verificada"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi