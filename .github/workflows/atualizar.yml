name: Radar de Editais - Pipeline Completo

on:
  schedule:
    - cron: "0 6,12,18,23 * * *" # Roda 4 vezes ao dia
  workflow_dispatch: # Permite rodar na mão pelo botão no GitHub
  push:
    branches: [main]
    paths: 
      - 'radar.py'
      - 'sources.json'
      - '.github/workflows/atualizar.yml'

permissions:
  contents: write

concurrency:
  group: radar-pipeline
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Aumentado porque a busca na IA demora
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || secrets.TAVILY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Chave da IA que o radar.py usa
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # Caso use Claude
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Buscar e extrair novos editais (IA)
        run: python -u radar.py run

      - name: 2. Resgatar prazos que a IA falhou (Regex)
        run: python resgatar_pendencias.py

      - name: 3. Exportar JSON formatado para o site
        run: python exportar_manual.py

      - name: 4. Salvar tudo de volta no GitHub
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${{ github.actor_id }}+$GITHUB_ACTOR@users.noreply.github.com"
          # Adiciona o banco de dados e o JSON exportado
          git add radar.db docs/editais.json data/
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Robô: Atualização automática de editais"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi