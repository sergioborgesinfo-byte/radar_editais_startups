name: Confirmar oportunidades pelo conteúdo

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Triar descobertas sem avaliar vigência"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: [confirmar_oportunidades.py, testes_conteudo.py, '.github/workflows/conteudo.yml']

permissions:
  contents: write
concurrency:
  group: radar-conteudo
  cancel-in-progress: false

jobs:
  confirmar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar evidências e fila
        run: python -I -S -m unittest discover -s . -p testes_conteudo.py
      - name: Instalar leitor de páginas e PDFs
        run: >-
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: -r requirements.txt
      - name: Confirmar 60 candidatos sem avaliar vigência
        run: python -u confirmar_oportunidades.py
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oportunidades-conteudo
          path: |
            data/oportunidades-conteudo.json
            data/oportunidades-conteudo.md
          if-no-files-found: ignore
      - name: Salvar confirmações de conteúdo
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${{ github.actor_id }}+$GITHUB_ACTOR@users.noreply.github.com"
          git add data/oportunidades-conteudo.json data/oportunidades-conteudo.md
          if ! git diff --cached --quiet; then
            git commit -m "Confirma relevância de oportunidades; vigência não avaliada"
            git push origin HEAD:main
          fi
