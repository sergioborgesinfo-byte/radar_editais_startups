name: Validar vigência e publicar abertas

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', sources.json, data/fontes-primarias-descobertas.json, data/oportunidades-conteudo.json, docs/acompanhamento.js, '.github/workflows/vigencia.yml']
  workflow_run:
    workflows: ["Descobrir oportunidades"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
concurrency:
  group: radar-pipeline
  cancel-in-progress: false

jobs:
  validar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: >-
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: -r requirements.txt
      - name: Validar contratos, orçamento e recuperação
        run: python -m unittest discover -s . -p 'testes_*.py'
      - name: Restaurar navegador e downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            .radar-leituras
            .radar-cache
          key: radar-pipeline-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}
          restore-keys: radar-pipeline-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-
      - name: Preparar navegador
        run: python -m playwright install --with-deps chromium
      - name: Executar todas as etapas com orçamento ampliado
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || secrets.TAVILY }}
          RADAR_IA_LIMITE: "20"
          CONTEUDO_LOTE: "60"
          VIGENCIA_IA_LIMITE: "20"
        run: python -u executar_pipeline.py
      - name: Preservar diagnóstico de execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execucao-radar
          path: data/execucao-pipeline.json
          if-no-files-found: ignore
      - name: Salvar estado e publicação
        if: always()
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${{ github.actor_id }}+$GITHUB_ACTOR@users.noreply.github.com"
          git add data docs/busca.json docs/editais.json
          if ! git diff --cached --quiet; then
            git commit -m "Salva rodada integrada, evidências e avanço real do Radar"
            git pull --rebase origin main
            git push origin HEAD:main
          fi