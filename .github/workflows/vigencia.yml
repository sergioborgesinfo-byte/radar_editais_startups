name: Validar vigência e publicar abertas

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [leitor_navegador.py, testes_leitor_navegador.py, leitura_cache.py, cronogramas.py, testes_cronogramas.py, vigencia_ia.py, testes_vigencia_ia.py, validar_vigencia.py, testes_vigencia.py, fontes_primarias.py, sebrae_programas.py, testes_sebrae.py, testes_fontes_primarias.py, docs/acompanhamento.js, '.github/workflows/vigencia.yml']
  workflow_run:
    workflows: ["Confirmar oportunidades pelo conteúdo"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
concurrency:
  group: radar-vigencia
  cancel-in-progress: false

jobs:
  validar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar vigência, modalidade e duplicação
        run: |
          python -I -S -m unittest discover -s . -p testes_leitor_navegador.py
          python -I -S -m unittest discover -s . -p testes_cronogramas.py
          python -I -S -m unittest discover -s . -p testes_vigencia_ia.py
          python -I -S -m unittest discover -s . -p testes_vigencia.py
          python -I -S -m unittest discover -s . -p testes_sebrae.py
          python -I -S -m unittest discover -s . -p testes_fontes_primarias.py
      - name: Instalar leitor de páginas e PDFs
        run: >-
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: -r requirements.txt
      - name: Instalar navegador para páginas dinâmicas
        id: navegador
        continue-on-error: true
        run: python -m playwright install --with-deps chromium
      - name: Verificar execução real de JavaScript
        if: steps.navegador.outcome == 'success'
        run: |
          python - <<'PY'
          from leitor_navegador import renderizar_html
          from urllib.parse import quote
          html='<main id="x"></main><script>document.getElementById("x").textContent="Inscricoes ate 20/12/2026"</script>'
          ct, corpo=renderizar_html('data:text/html,'+quote(html),lambda url:True)
          assert b'<main id="x">Inscricoes ate 20/12/2026</main>' in corpo
          print('Navegador leu o conteúdo produzido por JavaScript')
          PY
      - name: Reutilizar downloads de fontes oficiais
        uses: actions/cache/restore@v4
        with:
          path: .radar-leituras
          key: radar-vigencia-leituras-${{ github.run_id }}
          restore-keys: radar-vigencia-leituras-
      - name: Validar lote e exportar somente abertas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI }}
          VIGENCIA_IA_LIMITE: "8"
        run: |
          test -f data/cache-vigencia-ia.json || echo "{}" > data/cache-vigencia-ia.json
          for lote in 1 2 3; do
            echo "Processando lote automático $lote de 3"
            python -u validar_vigencia.py
            if python -c 'import json; d=json.load(open("data/oportunidades-vigencia.json")); exit(0 if d["ia"].get("parada") or not d["ia"].get("pendencias_restantes") else 1)'; then
              break
            fi
          done
      - name: Preservar downloads para a próxima rodada
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .radar-leituras
          key: radar-vigencia-leituras-${{ github.run_id }}
      - name: Salvar validações e publicação
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${{ github.actor_id }}+$GITHUB_ACTOR@users.noreply.github.com"
          git add data/cache-vigencia-ia.json data/oportunidades-vigencia.json docs/editais.json docs/busca.json
          if ! git diff --cached --quiet; then
            git commit -m "Valida edição, público e prazo; publica somente oportunidades abertas"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
